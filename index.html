<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Huss Valley Retro Bowl</title>
  <style>
    body {
      background-color: #111827;
      color: #f8fafc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 15px;
      user-select: none;
    }
    h1 {
      color: #fbbf24;
      letter-spacing: 2px;
      margin-bottom: 5px;
      text-shadow: 2px 2px #7f1d1d;
    }
    #hud {
      background-color: #1f2937;
      border: 2px solid #fbbf24;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    canvas {
      background-color: #15803d;
      border: 4px solid #ffffff;
      cursor: crosshair;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    .controls {
      margin-top: 10px;
      font-size: 14px;
      color: #cbd5e1;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>HUSS VALLEY RETRO BOWL</h1>
  <div id="hud">1ST & 10 | BALL ON: 20 | HUSS VALLEY: 0</div>
  <canvas id="field" width="840" height="420"></canvas>
  <div class="controls">
    <b>PASS:</b> Click & drag backward anywhere on the field to aim and throw.<br>
    <b>RUN:</b> Press <b>W / S</b> to dodge up & down | Press <b>SPACE</b> to Juke/Boost!
  </div>

  <script>
    const canvas = document.getElementById('field');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');

    // Field Scale: 80px endzones on each side, 680px playing field (100 yards = 6.8px per yard)
    const LEFT_EZ = 80;
    const RIGHT_EZ = 760;
    const PX_PER_YARD = 6.8;

    let score = 0;
    let down = 1;
    let lineOfScrimmage = 20; // Yard line (1 to 99)
    let firstDownLine = 30;
    let state = 'aim'; // 'aim', 'throw', 'run'
    let dragStart = null;
    let dragCurrent = null;
    let jukeTimer = 0;

    const qb = { x: 0, y: 210, w: 18, h: 18 };
    let receivers = [];
    let carrier = null;
    const ball = { x: 0, y: 0, vx: 0, vy: 0, active: false };
    let defenders = [];

    function yardToX(yard) {
      return LEFT_EZ + yard * PX_PER_YARD;
    }

    function xToYard(x) {
      return Math.round((x - LEFT_EZ) / PX_PER_YARD);
    }

    function setupPlay(resetDrive = false) {
      if (resetDrive) {
        down = 1;
        lineOfScrimmage = 20;
        firstDownLine = 30;
      }

      state = 'aim';
      carrier = null;
      ball.active = false;
      jukeTimer = 0;

      const losX = yardToX(lineOfScrimmage);
      qb.x = losX - 28;
      qb.y = 210;

      // Two Huss Valley Receivers running routes
      receivers = [
        { x: losX, y: 100, w: 18, h: 18, speed: 2.3, vy: 0.3 },
        { x: losX, y: 320, w: 18, h: 18, speed: 2.5, vy: -0.4 }
      ];

      // Defenders spaced downfield
      defenders = [
        { x: losX + 110, y: 110, w: 18, h: 18, speed: 1.75 },
        { x: losX + 130, y: 290, w: 18, h: 18, speed: 1.85 },
        { x: losX + 240, y: 200, w: 18, h: 18, speed: 1.95 },
        { x: losX + 360, y: 150, w: 18, h: 18, speed: 2.05 }
      ];

      updateHUD();
    }

    function updateHUD() {
      const suffix = down === 1 ? 'ST' : down === 2 ? 'ND' : down === 3 ? 'RD' : 'TH';
      const toGo = firstDownLine >= 100 ? 'GOAL' : Math.max(1, firstDownLine - lineOfScrimmage);
      hud.innerText = `${down}${suffix} & ${toGo} | BALL ON: ${lineOfScrimmage} | HUSS VALLEY: ${score}`;
    }

    // Mouse / Touch Aiming
    canvas.addEventListener('mousedown', (e) => {
      if (state !== 'aim') return;
      const rect = canvas.getBoundingClientRect();
      dragStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      dragCurrent = { ...dragStart };
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!dragStart) return;
      const rect = canvas.getBoundingClientRect();
      dragCurrent = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    });

    canvas.addEventListener('mouseup', () => {
      if (!dragStart || state !== 'aim') return;
      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      if (Math.hypot(dx, dy) > 10) {
        ball.x = qb.x + 9;
        ball.y = qb.y + 9;
        ball.vx = dx * 0.085;
        ball.vy = dy * 0.085;
        ball.active = true;
        state = 'throw';
      }
      dragStart = null;
    });

    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.code === 'Space' && state === 'run' && jukeTimer === 0) {
        jukeTimer = 18; // Short speed burst / juke
      }
    });
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    function endPlay(tackledX) {
      const newYard = Math.min(99, Math.max(1, xToYard(tackledX)));
      lineOfScrimmage = newYard;

      if (lineOfScrimmage >= firstDownLine) {
        down = 1;
        firstDownLine = Math.min(100, lineOfScrimmage + 10);
        setupPlay(false);
      } else {
        down++;
        if (down > 4) {
          alert('TURNOVER ON DOWNS! Starting a new Huss Valley drive.');
          setupPlay(true);
        } else {
          setupPlay(false);
        }
      }
    }

    function incompletePass() {
      down++;
      if (down > 4) {
        alert('INCOMPLETE - TURNOVER ON DOWNS!');
        setupPlay(true);
      } else {
        setupPlay(false);
      }
    }

    function update() {
      if (jukeTimer > 0) jukeTimer--;

      // Move receivers on routes before catch
      if (state === 'aim' || state === 'throw') {
        receivers.forEach(r => {
          r.x += r.speed;
          r.y += r.vy;
          if (r.y < 30 || r.y > canvas.height - 48) r.vy *= -1;
          if (r.x > RIGHT_EZ + 20) r.x = RIGHT_EZ + 20;
        });
      }

      // Ball flight
      if (state === 'throw' && ball.active) {
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Check catch by either receiver
        for (let r of receivers) {
          if (Math.hypot(ball.x - (r.x + 9), ball.y - (r.y + 9)) < 24) {
            state = 'run';
            carrier = r;
            ball.active = false;
            break;
          }
        }

        // Out of bounds
        if (ball.active && (ball.x > canvas.width || ball.x < 0 || ball.y < 0 || ball.y > canvas.height)) {
          incompletePass();
        }
      }

      // Ball carrier controls
      if (state === 'run' && carrier) {
        const boost = jukeTimer > 0 ? 1.8 : 0;
        carrier.x += 2.6 + boost;

        if (keys['w'] && carrier.y > 12) carrier.y -= (3.2 + boost);
        if (keys['s'] && carrier.y < canvas.height - 30) carrier.y += (3.2 + boost);

        // Touchdown check
        if (carrier.x >= RIGHT_EZ) {
          score += 7;
          alert('TOUCHDOWN HUSS VALLEY! +7 Points');
          setupPlay(true);
          return;
        }
      }

      // Defenders chase ball carrier (or closest receiver)
      if (state === 'throw' || state === 'run') {
        const target = carrier || receivers[0];
        defenders.forEach(d => {
          if (d.x > canvas.width - 20) return;
          const angle = Math.atan2(target.y - d.y, target.x - d.x);
          d.x += Math.cos(angle) * d.speed;
          d.y += Math.sin(angle) * d.speed;

          // Tackle check
          if (state === 'run' && carrier && Math.hypot(d.x - carrier.x, d.y - carrier.y) < 16) {
            endPlay(carrier.x);
          }
        });
      }
    }

    function drawPlayer(x, y, w, h, jerseyColor, helmetColor) {
      // Body
      ctx.fillStyle = jerseyColor;
      ctx.fillRect(x, y + 4, w, h - 4);
      // Helmet
      ctx.fillStyle = helmetColor;
      ctx.fillRect(x + 2, y, w - 4, 7);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Yard lines every 10 yards
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 2;
      ctx.font = 'bold 14px Courier New';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';

      for (let yd = 10; yd <= 90; yd += 10) {
        const x = yardToX(yd);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();

        const label = yd <= 50 ? yd : 100 - yd;
        ctx.fillText(label, x - 8, 22);
        ctx.fillText(label, x - 8, canvas.height - 10);
      }

      // Left Endzone (Opponent)
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, LEFT_EZ, canvas.height);

      // Right Endzone (HUSS VALLEY)
      ctx.fillStyle = '#7f1d1d';
      ctx.fillRect(RIGHT_EZ, 0, canvas.width - RIGHT_EZ, canvas.height);
      ctx.save();
      ctx.translate(808, canvas.height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 26px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('HUSS VALLEY', 0, 0);
      ctx.restore();

      // Line of Scrimmage (Blue) & First Down Marker (Yellow)
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(yardToX(lineOfScrimmage), 0);
      ctx.lineTo(yardToX(lineOfScrimmage), canvas.height);
      ctx.stroke();

      if (firstDownLine < 100) {
        ctx.strokeStyle = '#fbbf24';
        ctx.beginPath();
        ctx.moveTo(yardToX(firstDownLine), 0);
        ctx.lineTo(yardToX(firstDownLine), canvas.height);
        ctx.stroke();
      }

      // Aiming Dotted Line
      if (state === 'aim' && dragStart && dragCurrent) {
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(qb.x + 9, qb.y + 9);
        ctx.lineTo(qb.x + 9 + (dragStart.x - dragCurrent.x), qb.y + 9 + (dragStart.y - dragCurrent.y));
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Draw Huss Valley QB & Receivers (Crimson & Gold)
      drawPlayer(qb.x, qb.y, qb.w, qb.h, '#991b1b', '#fbbf24');
